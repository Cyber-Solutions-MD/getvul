worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # Only allow WebSocket upgrades (prevent H2C smuggling)
    map $http_upgrade $connection_upgrade {
        default  "";
        ~*websocket  upgrade;
    }
    map $http_upgrade $upgrade_safe {
        default  "";
        ~*websocket  websocket;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    # HTTP → HTTPS redirect (only if SSL cert exists)
    server {
        listen 80;
        server_name _;

        # Check if SSL cert exists
        set $has_ssl 0;
        if (-f /etc/nginx/certs/server.crt) {
            set $has_ssl 1;
        }

        # If SSL available, redirect to HTTPS
        if ($has_ssl = 1) {
            return 301 https://$host$request_uri; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        }

        # If no SSL, serve directly over HTTP
        location / {
            proxy_pass http://frontend:3000;
            # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $upgrade_safe;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend:8000/auth/;
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend:8000/health;
        }

        location /docs {
            proxy_pass http://backend:8000/docs;
        }

        location /dev/ {
            proxy_pass http://backend:8000/dev/;
        }

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://frontend:3000;
            # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
            proxy_http_version 1.1;
            proxy_set_header Upgrade $upgrade_safe;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://backend:8000/auth/;
            proxy_set_header Host $host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /health {
            proxy_pass http://backend:8000/health;
        }

        location /docs {
            proxy_pass http://backend:8000/docs;
        }

        location /dev/ {
            proxy_pass http://backend:8000/dev/;
        }
    }
}
