name: CI

on:
  workflow_dispatch:  # Manual trigger only — re-enable push/PR triggers when ready
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getvul
          POSTGRES_PASSWORD: getvul
          POSTGRES_DB: getvul_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getvul"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy app/ | mypy-baseline filter
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://getvul:getvul@localhost:5432/getvul_test
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://getvul:getvul@localhost:5432/getvul_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
          ENVIRONMENT: test
        run: pytest -v --cov=app --cov-report=xml
      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          file: backend/coverage.xml
          flags: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Lint
        run: npm run lint || true
      - name: Type check
        run: npx tsc --noEmit || true
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: Run Semgrep (publish to semgrep.dev)
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Start application stack
        run: |
          docker compose -f docker-compose.ci.yml up -d --build
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then echo "Backend ready!"; break; fi
            echo "  attempt $i/30..."; sleep 5
          done
          curl -sf http://localhost:8000/health || (docker compose -f docker-compose.ci.yml logs backend && exit 1)
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then echo "Frontend ready!"; break; fi
            echo "  attempt $i/30..."; sleep 5
          done
          curl -sf http://localhost:3000 > /dev/null 2>&1 || echo "Frontend not ready — skipping frontend scan"

      - name: ZAP API Scan (OpenAPI)
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:8000/openapi.json
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-api-scan
        continue-on-error: true

      - name: ZAP Baseline Scan (Backend)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8000
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-backend-baseline
        continue-on-error: true

      - name: ZAP Baseline Scan (Frontend)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:3000
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-frontend-baseline
        continue-on-error: true

      - name: Stop application stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
