name: CI

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC nightly DAST sweep

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  docs:
    # Guards against doc/CI drift shipping silently (Phase 2 IN-04): verify-docs.sh
    # asserts the CI-gating docs stay in sync with the workflow (required-check names,
    # branch-protection.json reference, and no stale "workflow_dispatch only" wording).
    # Not yet a required check — add "Docs" to .github/branch-protection.json to block on it.
    name: Docs
    runs-on: ubuntu-latest
    steps:
      # All action uses in this workflow are pinned to immutable commit SHAs
      # (supply-chain hardening; the trailing "# vN" records the human-readable tag).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify CI-gating docs are in sync
        run: bash .github/verify-docs.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getvul
          POSTGRES_PASSWORD: getvul
          POSTGRES_DB: getvul_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getvul"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy)
        # pipefail (GitHub Actions default shell) would leak mypy's non-zero exit —
        # mypy exits 1 whenever any error exists, including baselined ones. Disable it
        # so the pipeline's exit code is mypy-baseline filter's: 0 when only baselined
        # errors remain, non-zero only on NEW errors. That is the actual gate.
        # --allow-unsynced: don't fail on "fixed" (resolved) baseline entries. App
        # deps are unpinned (>=), so CI's resolved library versions differ slightly
        # from the baseline-generation env, leaving a few baselined errors that CI
        # doesn't reproduce. Those are harmless; only NEW type errors should block.
        run: |
          set +o pipefail
          mypy app/ | mypy-baseline filter --allow-unsynced
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://getvul:getvul@localhost:5432/getvul_test
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://getvul:getvul@localhost:5432/getvul_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
          ENVIRONMENT: test
        run: pytest -v --cov=app --cov-report=xml
      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          file: backend/coverage.xml
          flags: backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.7"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Semgrep (publish to semgrep.dev)
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  ai-evals:
    # AIE-01 CI-blocking gate: keyless, deterministic DeepEval structural
    # metrics (schema/grounding/no-rank/no-PII/cite-or-refuse) run against
    # committed golden fixtures. No ANTHROPIC_API_KEY anywhere in this job —
    # BYOK means no GetVul-owned key, including in CI (28-CONTEXT.md D-01).
    name: AI Golden-Set Evals (DeepEval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run DeepEval golden-set suite (keyless -- structural metrics only, no DB/Redis needed)
        env:
          DEEPEVAL_TELEMETRY_OPT_OUT: "1"
        # test_nlq_golden_evals.py (44-06-PLAN.md/NLQ-02) extends this SAME
        # keyless job additively -- never a parallel eval pipeline.
        run: deepeval test run tests/evals/test_golden_evals.py tests/evals/test_nlq_golden_evals.py

  ai-redteam-injection:
    # AIE-02/AIE-03 CI-blocking gate: static prompt-builder inspection
    # (injection-as-data isolation contract) + the no-bypass budget-guard
    # coverage test. The budget-coverage test exercises the `client` fixture
    # (a real app + DB), so this job mirrors the `backend` job's Postgres/
    # Redis services + migration step verbatim. No ANTHROPIC_API_KEY.
    name: AI Prompt-Injection Red-Team (static)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: getvul
          POSTGRES_PASSWORD: getvul
          POSTGRES_DB: getvul_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U getvul"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://getvul:getvul@localhost:5432/getvul_test
        run: alembic upgrade head
      - name: Run consolidated injection-isolation + no-bypass budget coverage suites (keyless)
        env:
          DATABASE_URL: postgresql+asyncpg://getvul:getvul@localhost:5432/getvul_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret
          ENVIRONMENT: test
          # Disposable, non-secret Fernet key for this ephemeral CI DB only --
          # test_ai_budget_coverage.py seeds a real encrypted ANTHROPIC
          # ConnectorConfig row (encrypt_value() -> Fernet(settings.encryption_key)),
          # so the class-level placeholder default is not a valid 32-byte
          # url-safe base64 key and raises ValueError before any test runs
          # (same documented requirement as test_ai_explain_stream.py).
          ENCRYPTION_KEY: "9ynx6kK8mLb2ag-LhSCjA1L7oGWg873tk6dIQ45FBIA="
        run: pytest tests/test_ai_injection_redteam.py tests/test_ai_budget_coverage.py -v

  ai-live-eval-optin:
    # Opt-in, key-gated, NON-blocking live tier (LLM-judge faithfulness +
    # real promptfoo red-team). Only runs when a developer supplies their
    # own ANTHROPIC key via the DEV_ANTHROPIC_API_KEY secret -- never a
    # GetVul-owned/shared key. Must NEVER be added to branch-protection.json
    # required checks (28-CONTEXT.md D-01). Never runs on fork PRs (no
    # secret exposure to untrusted forks).
    name: AI Live Eval + Red-Team (opt-in, non-blocking)
    runs-on: ubuntu-latest
    needs: [backend]
    continue-on-error: true # never blocks -- opt-in tier only, per D-01
    env:
      HAS_DEV_KEY: ${{ secrets.DEV_ANTHROPIC_API_KEY != '' }} # indirection avoids the secrets-in-if gotcha
    if: ${{ github.event.repository.fork == false }} # never run against untrusted fork PRs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Skip if no dev key configured
        if: env.HAS_DEV_KEY != 'true'
        run: echo "No DEV_ANTHROPIC_API_KEY secret configured -- skipping opt-in live eval tier." && exit 0
      - name: Set up Python
        if: env.HAS_DEV_KEY == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        if: env.HAS_DEV_KEY == 'true'
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run DeepEval LLM-judge suite (Anthropic judge, dev key)
        if: env.HAS_DEV_KEY == 'true'
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEV_ANTHROPIC_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "1"
        run: deepeval test run tests/evals/test_llm_judge_evals.py
      - name: Set up Node.js
        if: env.HAS_DEV_KEY == 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run promptfoo red-team (real adversarial generation + LLM grading)
        if: env.HAS_DEV_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DEV_ANTHROPIC_API_KEY }}
        run: npx promptfoo@0.121.20 redteam run -c redteam/promptfooconfig.yaml -o redteam-results.json

  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Start application stack
        run: |
          docker compose -f docker-compose.ci.yml up -d --build
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then echo "Backend ready!"; break; fi
            echo "  attempt $i/30..."; sleep 5
          done
          curl -sf http://localhost:8000/health || (docker compose -f docker-compose.ci.yml logs backend && exit 1)
          echo "Waiting for frontend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then echo "Frontend ready!"; break; fi
            echo "  attempt $i/30..."; sleep 5
          done
          curl -sf http://localhost:3000 > /dev/null 2>&1 || echo "Frontend not ready — skipping frontend scan"

      - name: ZAP API Scan (OpenAPI)
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: http://localhost:8000/openapi.json
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-api-scan
        continue-on-error: true

      - name: ZAP Baseline Scan (Backend)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:8000
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-backend-baseline
        continue-on-error: true

      - name: ZAP Baseline Scan (Frontend)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: zap-frontend-baseline
        continue-on-error: true

      - name: Stop application stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
