# Minimal compose for CI — no volumes, no hot-reload, no nginx
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: getvul
      POSTGRES_PASSWORD: getvul
      POSTGRES_DB: getvul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getvul"]
      interval: 3s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://getvul:getvul@postgres:5432/getvul"
      REDIS_URL: "redis://redis:6379/0"
      DEBUG: "true"
      ENVIRONMENT: "development"
      JWT_SECRET_KEY: "ci-test-secret-not-for-prod"
      ENCRYPTION_KEY: "3iPwTM32LuijVi-uwCGt448cCCPHGVvUoriwi0A3FkY="
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --port 3000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
