[project]
name = "getvul-backend"
version = "0.1.0"
description = "GetVul — Unified Vulnerability Aggregation Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "orjson>=3.10",
    "tenacity>=9.0",
    "croniter>=3.0",
    "structlog>=24.0",
    "cryptography>=43.0",
    "bcrypt>=4.0",
    "fpdf2>=2.8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff==0.15.21",  # pinned: unpinned ruff auto-upgrades in CI and makes the lint/format gate non-deterministic
    "mypy==2.1.0",    # pinned: the mypy-baseline is line/version-sensitive — drift silently breaks the type gate
    "mypy-baseline==0.7.4",  # REQUIRED by ci.yml `mypy app/ | mypy-baseline filter`; was missing on main → step failed 127
    "factory-boy>=3.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC"]
ignore = [
    "B008",   # mutable default in function args — false positive for FastAPI Depends/Query
    "E501",   # line too long — handled by formatter, many long strings in migrations
    "E701",   # multiple statements on one line — used for compact early returns
    "E702",   # semicolon-separated statements
    "UP042",  # timezone.utc → UTC alias
    "TC001", "TC002", "TC003",  # type-checking imports — not worth refactoring
    "F821",   # undefined name — false positive for SQLAlchemy string forward references
    "B904",   # raise from — FastAPI HTTPException re-raise pattern
    "E402",   # module level import not at top — needed for conditional imports
    "N814",   # camelcase imported as constant — common pattern for short aliases
    "UP017",  # datetime.UTC alias — mixed usage across codebase
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["N999", "E501"]
"tests/**" = ["F841"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
